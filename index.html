<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aldora Enterprise Suite Ultra Max — Manufacturing ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--soft:#f1f5f9;--primary:#020617;--accent:#0ea5e9;--success:#059669;--danger:#e11d48;--warning:#d97706}
    body.dark{--bg:#020617;--card:#0f172a;--text:#f8fafc;--muted:#94a3b8;--border:#1e293b;--soft:#111827;--primary:#38bdf8;--accent:#22c55e}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:1.35rem;box-shadow:0 10px 30px rgba(15,23,42,.065)} .soft{background:var(--soft)} .muted{color:var(--muted)}
    .glass{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14)} .section{display:none}.section.active{display:block}.nav-btn{color:#cbd5e1}.nav-btn.active{background:white;color:#020617}.dark .nav-btn.active{background:#38bdf8;color:#020617}
    .modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.toast{position:fixed;right:20px;bottom:20px;z-index:80;animation:pop .22s ease-out}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:#020617;border-radius:99px}.dark .bar{background:#38bdf8}

    /* Ultra Max Dark Mode Fix: force every common Tailwind light utility to readable dark colors */
    body.dark .card, body.dark .soft{color:var(--text)}
    body.dark input, body.dark select, body.dark textarea{background:#0b1220!important;color:#f8fafc!important;border-color:#334155!important}
    body.dark input::placeholder, body.dark textarea::placeholder{color:#94a3b8!important}
    body.dark table, body.dark td, body.dark th{color:#e5e7eb;border-color:#1e293b!important}
    body.dark .border, body.dark .border-b, body.dark .border-slate-200, body.dark .border-slate-100{border-color:#1e293b!important}
    body.dark .bg-white, body.dark .bg-slate-50, body.dark .bg-slate-100{background:#0f172a!important;color:#f8fafc!important}
    body.dark .text-slate-900, body.dark .text-slate-800, body.dark .text-slate-700, body.dark .text-slate-600{color:#f8fafc!important}
    body.dark .text-slate-500, body.dark .text-slate-400{color:#94a3b8!important}
    body.dark .bg-rose-50{background:#4c0519!important;color:#fecdd3!important}
    body.dark .text-rose-700{color:#fecdd3!important}
    body.dark .bg-emerald-50{background:#052e16!important;color:#bbf7d0!important}
    body.dark .text-emerald-700{color:#bbf7d0!important}
    body.dark .bg-amber-50{background:#451a03!important;color:#fde68a!important}
    body.dark .text-amber-700{color:#fde68a!important}
    body.dark .progress{background:#1e293b}
    body.dark button.bg-white{background:#0f172a!important;color:#f8fafc!important;border-color:#334155!important}
    body.dark .toast{background:#0f172a!important;color:#f8fafc!important;border-color:#334155!important}
    @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}} @media print{aside,.no-print,#loginScreen,.modal-bg{display:none!important}main{padding:0!important;max-width:none!important}body{background:white!important;color:#111827!important}.card{box-shadow:none!important;break-inside:avoid}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal-bg"><div class="card max-w-3xl w-full p-6"><div class="flex justify-between gap-4"><div><h2 id="modalTitle" class="text-2xl font-black">Detail</h2><p id="modalDesc" class="muted mt-2"></p></div><button onclick="closeModal()" class="text-3xl leading-none no-print">×</button></div><div id="modalBody" class="mt-5"></div></div></div>
<script>
const VERSION='Ultra Max 10.0 Browser Edition';
const modules=[['dashboard','CEO Cockpit','📊'],['finance','Finance','💰'],['modeling','FP&A','📈'],['production','Production','🏭'],['quality','Quality','✅'],['maintenance','Maintenance','🛠️'],['inventory','Inventory','📦'],['procurement','Procurement','🛒'],['sales','CRM','🤝'],['hr','HR','👥'],['risk','Risk','⚠️'],['workflow','Workflow','🔀'],['projects','Projects','🚀'],['security','Security','🔐'],['architecture','Architecture','🏗️'],['report','Board Report','📄']];
const seed={
monthly:[['Jan',4.8,1.75,.49,1.25,4.7],['Feb',5.1,1.9,.56,1.39,5.0],['Mar',5.5,2.08,.63,1.51,5.4],['Apr',5.9,2.26,.72,1.7,5.8],['Mei',6.2,2.42,.8,1.92,6.1],['Jun',6.7,2.65,.91,2.24,6.5],['Jul',7.1,2.85,1.01,2.52,7.0],['Agu',7.4,2.97,1.06,2.7,7.3],['Sep',null,null,null,null,7.8],['Okt',null,null,null,null,8.2],['Nov',null,null,null,null,8.7],['Des',null,null,null,null,9.1]],
inventory:[['RM-STEEL-01','Steel Coil','Raw Material',128,90,180,1650,'OK'],['RM-RESIN-04','Industrial Resin','Chemical',42,60,130,720,'Reorder'],['FG-PART-A','Finished Part A','Finished Goods',8800,4000,9000,1350,'OK'],['FG-OEM-X','OEM Custom X','Finished Goods',3100,900,1800,980,'Overstock'],['SP-MOTOR-02','Spare Motor','Sparepart',3,4,10,220,'Critical'],['PKG-BOX-12','Export Box','Packaging',5400,2500,8000,180,'OK']],
suppliers:[['PT Baja Prima','Raw Material',8200,94,97,'Medium','A'],['Nusantara Resin','Chemical',3900,83,91,'High','B'],['Global Packaging','Packaging',1700,96,98,'Low','A'],['MachPro Service','Maintenance',950,88,94,'Medium','B'],['Logistik Cakra','Logistics',1120,90,92,'Medium','B']],
crm:[['PT Mega Industri','Proposal',2100,65,'Key Account A'],['Garuda Components','Negotiation',1450,72,'Key Account B'],['Asia OEM Group','Qualified',3200,45,'Sales Director'],['Retail Modern Chain','Won',980,100,'Channel Lead'],['Japan Auto Parts','Discovery',4200,30,'Enterprise Sales']],
risks:[['Kenaikan harga bahan baku','Supply Chain','Procurement',5,5,'Kontrak harga, dual sourcing, safety stock'],['Piutang pelanggan terlambat','Finance','CFO',4,4,'Credit limit, aging review, early payment'],['Downtime mesin utama','Operations','COO',3,5,'Preventive maintenance, spare part kritikal'],['Kompetitor perang harga','Market','CMO',3,4,'Value selling, bundling, kontrak volume'],['Regulasi lingkungan baru','Compliance','Legal',2,4,'Audit compliance dan dokumen AMDAL']],
approvals:[['APR-10021','CAPEX','CNC Upgrade Line B',2800,'CEO','Pending'],['APR-10022','Vendor','New Resin Supplier',0,'Procurement','Review'],['APR-10023','Discount','Special Pricing OEM',640,'CFO','Pending'],['APR-10024','Hiring','Production Supervisor',180,'HR','Approved'],['APR-10025','Maintenance','Compressor Overhaul',320,'COO','Pending']],
audit:[['09:12','CFO','Updated revenue forecast','FP&A','Info'],['09:48','Procurement','Changed supplier risk to High','Supplier','Warning'],['10:05','CEO','Approved strategic budget','Workflow','Success'],['10:41','System','Detected abnormal login attempt','Security','Critical']],
quality:[['Line A','Part A','99.2%','1.8%','Passed','Low'],['Line B','Component B','96.7%','4.9%','Action Needed','Medium'],['Line C','Assembly C','98.8%','2.1%','Passed','Low'],['Supplier Resin','Chemical Lot R-24','94.5%','6.2%','Hold','High']],
maintenance:[['CNC Line B','Preventive','2026-05-25','78%','Medium'],['Compressor 2','Corrective','2026-05-24','42%','High'],['Forklift 7','Preventive','2026-05-29','91%','Low'],['Packing Robot','Calibration','2026-06-02','85%','Low']],
projects:[['ERP Phase 2','Digital Transformation','68%','COO','On Track'],['Warehouse Barcode','Operations','82%','WH Manager','On Track'],['Supplier Portal','Procurement','43%','Procurement','At Risk'],['ISO 9001 Refresh','Quality','74%','QA Head','On Track']]
};
let db=JSON.parse(localStorage.aldoraUltra||'null')||structuredClone(seed); let state=JSON.parse(localStorage.aldoraState||'null')||{logged:false,role:'CEO',user:'ceo@company.com',module:'dashboard',dark:false}; let charts=[];
const el=x=>document.getElementById(x), save=()=>{localStorage.aldoraUltra=JSON.stringify(db);localStorage.aldoraState=JSON.stringify(state)}, money=v=>'Rp'+Number(Math.round(v)).toLocaleString('id-ID')+' Jt';
function tone(x){return ['Low','OK','Passed','Approved','Success','On Track','A','Enabled'].includes(x)?'good':['High','Critical','Hold','Reorder','Pending','At Risk'].includes(x)?'danger':'warn'}
function pill(x){let t=tone(x),c=t==='good'?'bg-emerald-50 text-emerald-700 border-emerald-100':t==='danger'?'bg-rose-50 text-rose-700 border-rose-100':'bg-amber-50 text-amber-700 border-amber-100';return `<span class="px-2 py-1 rounded-full border text-xs font-bold ${c}">${x}</span>`}
function metric(t,v,d,emoji){return `<div onclick="openMetric('${t}','${String(v).replaceAll("'",'')}','${d}')" class="card p-5 cursor-pointer hover:scale-[1.01] transition"><div class="flex justify-between"><div class="text-2xl">${emoji}</div><span class="text-xs font-bold muted">drilldown</span></div><p class="text-sm muted mt-4">${t}</p><h3 class="text-2xl font-black mt-1">${v}</h3><p class="text-xs muted mt-2">${d}</p></div>`}
function card(title,sub,body){return `<div class="card"><div class="p-5 border-b" style="border-color:var(--border)"><h2 class="font-black">${title}</h2><p class="text-sm muted mt-1">${sub}</p></div><div class="p-5">${body}</div></div>`}
function table(head,rows){return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left muted border-b">${head.map(h=>`<th class="py-3 pr-4">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function loginScreen(){return `<div id="loginScreen" class="min-h-screen grid lg:grid-cols-2 bg-slate-950 text-white"><section class="relative p-8 md:p-14 flex flex-col justify-between overflow-hidden"><div class="absolute inset-0 opacity-30" style="background:radial-gradient(circle at top left,#38bdf8,transparent 35%),radial-gradient(circle at bottom right,#22c55e,transparent 30%)"></div><div class="relative"><div class="flex items-center gap-3 mb-12"><div class="bg-white text-slate-950 rounded-2xl p-3 text-2xl">🏭</div><div><h1 class="text-2xl font-black">Aldora Enterprise Suite</h1><p class="text-slate-400 text-sm">${VERSION}</p></div></div><div class="inline-flex px-3 py-1 rounded-full bg-emerald-400/10 text-emerald-300 border border-emerald-400/20 text-xs font-bold mb-5">🔐 Secure Enterprise Access Portal</div><h2 class="text-4xl md:text-6xl font-black max-w-2xl">Manufacturing ERP, AI analytics, approval, risk, and board command center.</h2><p class="text-slate-300 mt-5 max-w-xl">Versi full upgrade: UI premium, modul lebih lengkap, data lebih kaya, LocalStorage, export, print/PDF, KPI drilldown, dan simulasi enterprise workflow.</p></div><div class="relative grid grid-cols-2 md:grid-cols-4 gap-3">${['RBAC','MFA','Audit','AI'].map(x=>`<div class="glass rounded-2xl p-4"><b>${x}</b><p class="text-xs text-slate-400 mt-1">Enterprise ready</p></div>`).join('')}</div></section><section class="bg-slate-50 text-slate-900 p-6 md:p-12 flex items-center justify-center"><div class="card w-full max-w-lg p-8 shadow-2xl"><h2 class="text-3xl font-black">Welcome back</h2><p class="muted mt-2">Sign in to Aldora Enterprise Suite Ultra.</p><form onsubmit="doLogin(event)" class="mt-7 space-y-4"><input id="email" value="ceo@company.com" class="w-full px-4 py-3 rounded-2xl border"/><input id="pass" type="password" value="password123" class="w-full px-4 py-3 rounded-2xl border"/><div class="grid md:grid-cols-2 gap-4"><select id="role" class="w-full px-4 py-3 rounded-2xl border bg-white"><option>CEO</option><option>CFO</option><option>COO</option><option>CMO</option><option>Procurement</option><option>Auditor</option></select><input id="mfa" value="123456" maxlength="6" class="w-full px-4 py-3 rounded-2xl border"/></div><button class="w-full py-3.5 rounded-2xl bg-slate-950 text-white font-black">Enter Enterprise Portal</button></form><div class="mt-6 p-4 rounded-2xl bg-slate-50 border text-sm text-slate-600"><b>Demo:</b> ceo@company.com / password123 / MFA 123456</div></div></section></div>`}
function doLogin(e){e.preventDefault(); if(el('pass').value!=='password123'||el('mfa').value!=='123456')return toast('Login gagal'); state={...state,logged:true,role:el('role').value,user:el('email').value}; db.audit.unshift([new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),state.role,'Login enterprise portal','Security','Success']); save(); render(); toast('Login berhasil')}
function layout(content){document.body.className=state.dark?'dark':'';return `<div class="flex"><aside class="hidden xl:flex w-80 min-h-screen bg-slate-950 text-white p-5 flex-col sticky top-0"><div class="flex items-center gap-3 mb-7"><div class="p-3 rounded-2xl bg-white text-slate-950 text-2xl">🏭</div><div><h1 class="font-black text-lg">Aldora Enterprise</h1><p class="text-xs text-slate-400">${VERSION}</p></div></div><nav class="space-y-1.5 overflow-y-auto pr-1">${modules.map(m=>`<button onclick="go('${m[0]}')" class="nav-btn ${state.module===m[0]?'active':''} w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold"><span>${m[2]}</span>${m[1]}</button>`).join('')}</nav><div class="mt-5 p-4 rounded-2xl bg-slate-900 border border-slate-800"><div class="text-emerald-400 text-sm font-bold">✅ Enterprise Mode Active</div><p class="text-xs text-slate-500 mt-2">RBAC • MFA • AI • audit • workflow • export • browser only.</p></div></aside><main class="flex-1 p-4 md:p-8 max-w-[1750px] mx-auto w-full"><div class="flex flex-col lg:flex-row justify-between gap-4 mb-6"><div><div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 text-white text-xs font-bold mb-3">🏢 AI-Powered Manufacturing ERP</div><h1 class="text-3xl md:text-5xl font-black tracking-tight">Aldora Enterprise Command Center Ultra</h1><p class="muted mt-3 max-w-4xl">Finance, FP&A, produksi, quality, maintenance, inventory, procurement, CRM, HR, risk, workflow, projects, security, architecture, dan board report.</p><div class="mt-4 flex flex-col md:flex-row gap-3 no-print"><div class="flex-1 card px-4 py-3 flex items-center gap-3"><span>🔎</span><input id="search" oninput="globalSearch()" class="w-full outline-none text-sm bg-transparent" placeholder="Global search: KPI, supplier, approval, risiko, customer..."/><span class="text-xs font-bold muted">Ctrl K</span></div><button onclick="toggleDark()" class="bg-white border text-slate-900 rounded-2xl px-5 py-3 text-sm font-bold">🌙 Dark</button><button onclick="exportCSV()" class="bg-emerald-600 text-white rounded-2xl px-5 py-3 text-sm font-bold">Export CSV</button><button onclick="snapshot()" class="bg-sky-600 text-white rounded-2xl px-5 py-3 text-sm font-bold">Snapshot</button><button onclick="resetData()" class="bg-white border text-slate-900 rounded-2xl px-5 py-3 text-sm font-bold">Reset</button><button onclick="window.print()" class="bg-slate-950 text-white rounded-2xl px-5 py-3 text-sm font-bold">Print/PDF</button><button onclick="logout()" class="bg-rose-50 text-rose-700 rounded-2xl px-5 py-3 text-sm font-bold">Logout</button></div></div><div class="card p-5 min-w-[300px] bg-slate-950 text-white border-slate-900"><p class="text-sm text-slate-400">Enterprise Health Score</p><h2 id="healthScore" class="text-5xl font-black mt-1">98</h2><p class="text-xs text-slate-400 mt-3">Dynamic score from profit, risk, quality, inventory and execution.</p></div></div><div class="xl:hidden mb-6 flex gap-2 overflow-x-auto pb-2 no-print">${modules.map(m=>`<button onclick="go('${m[0]}')" class="shrink-0 bg-white border rounded-full px-4 py-2 text-sm font-bold">${m[2]} ${m[1]}</button>`).join('')}</div><div id="searchResult" class="hidden card p-4 mb-6"></div>${content}</main></div>`}
function go(m){state.module=m;save();render()} function logout(){state.logged=false;save();render()} function toggleDark(){state.dark=!state.dark;save();render()} function render(){el('app').innerHTML=state.logged?layout(moduleContent()):loginScreen();setTimeout(drawCharts,60)}
function moduleContent(){let actual=db.monthly.filter(m=>m[1]),rev=actual.reduce((s,m)=>s+m[1],0),np=actual.reduce((s,m)=>s+m[3],0),inv=db.inventory.reduce((s,i)=>s+i[6],0),pipe=db.crm.reduce((s,c)=>s+c[2]*c[3]/100,0),crit=db.risks.filter(r=>r[3]*r[4]>=16).length, qHold=db.quality.filter(q=>q[4]!=='Passed').length; setTimeout(()=>{if(el('healthScore'))el('healthScore').textContent=Math.min(99,Math.round(91+(np/rev)*35-crit+Math.max(0,3-qHold)))},0);
if(state.module==='dashboard')return `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-6 gap-4 mb-6">${metric('Revenue YTD',rev.toFixed(1)+' M','Actual Jan–Agu','💰')}${metric('Net Margin',((np/rev)*100).toFixed(1)+'%','Margin bersih','📈')}${metric('Inventory Value',money(inv),'Raw, WIP, FG','📦')}${metric('Weighted Pipeline',money(pipe),'Probability adjusted','🤝')}${metric('Critical Risks',crit,'Board attention','⚠️')}${metric('Quality Holds',qHold,'Need action','✅')}</div><div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-6">${card('AI Forecast & Performance Cockpit','Actual vs forecast, EBITDA, net profit','<canvas id="chartMain" height="130"></canvas>')}${card('Executive Alerts','Prioritas lintas departemen','<div class="space-y-3"><div class="p-4 rounded-2xl bg-rose-50 text-rose-800 font-bold">⚠️ Resin stock below minimum</div><div class="p-4 rounded-2xl bg-amber-50 text-amber-800 font-bold">🏭 Line B bottleneck</div><div class="p-4 rounded-2xl bg-sky-50 text-sky-800 font-bold">🛠️ Compressor maintenance due</div><div class="p-4 rounded-2xl bg-emerald-50 text-emerald-800 font-bold">✅ Sales pipeline strong</div></div>')}</div><div class="grid grid-cols-1 xl:grid-cols-2 gap-6">${card('AI Recommendation Engine','Rekomendasi otomatis','<div class="space-y-3">'+['Approve resin PR today','Run maintenance kaizen on Line B','Reduce DSO through credit hold','Focus Asia OEM Group deal','Start supplier qualification backup'].map((x,i)=>`<div class="soft p-4 rounded-2xl"><b>${i<2?'P1':'P2'} — ${x}</b><p class="muted text-sm mt-1">Confidence ${96-i*3}%</p></div>`).join('')+'</div>')}${card('Data Quality Control Tower','Kualitas data untuk keputusan CEO','<div class="space-y-3">'+['Finance 98%','Production 94%','Inventory 91%','Quality 93%','CRM 87%','HR 95%'].map(x=>`<div><div class="flex justify-between text-sm"><b>${x.split(' ')[0]}</b><span>${x.split(' ')[1]}</span></div><div class="progress"><div class="bar" style="width:${x.split(' ')[1]}"></div></div></div>`).join('')+'</div>')}</div>`;
if(state.module==='finance')return `<div class="grid md:grid-cols-4 gap-4 mb-6">${metric('Gross Margin','39.1%','Target >35%','🥧')}${metric('EBITDA Margin','21.3%','Target >18%','🏦')}${metric('DSO','43 Hari','Target <35','📅')}${metric('Free Cash Flow','Rp1.4 M','Positive','💸')}</div>${card('Profit & Loss Analytics','Revenue, gross profit, EBITDA, net profit','<canvas id="chartFinance" height="110"></canvas>')}`;
if(state.module==='modeling')return card('FP&A Scenario Modeling','Simulasi revenue growth, margin, opex dan capex',`<div class="grid md:grid-cols-4 gap-4"><label>Revenue Growth <b id="gval">14%</b><input id="growth" type="range" min="-20" max="60" value="14" oninput="calcModel()" class="w-full"></label><label>Gross Margin <b id="gmval">37%</b><input id="gm" type="range" min="15" max="65" value="37" oninput="calcModel()" class="w-full"></label><label>Opex <b id="opexval">15800</b><input id="opex" type="range" min="9000" max="25000" value="15800" oninput="calcModel()" class="w-full"></label><label>CAPEX <b id="capexval">3200</b><input id="capex" type="range" min="0" max="12000" value="3200" oninput="calcModel()" class="w-full"></label></div><div id="modelResult" class="grid grid-cols-1 md:grid-cols-5 gap-4 mt-5"></div>`);
let tables={production:['Production Planning',['Line','Product','Capacity','Planned','Actual','OEE','Status'],[['Line A','Industrial Part A','22,000','19,800','18,600','81%','On Track'],['Line B','Component B','18,000','17,200','15,100','74%','Bottleneck'],['Line C','Assembly C','14,500','13,000','12,800','86%','Excellent'],['Line D','Export Assembly','12,000','10,800','10,200','79%','On Track']]],quality:['Quality Control & Compliance',['Area','Item','Yield','Defect','Status','Risk'],db.quality],maintenance:['Maintenance & Asset Reliability',['Asset','Type','Due Date','Health','Risk'],db.maintenance],inventory:['Inventory & Warehouse',['SKU','Item','Category','Stock','Min','Max','Value','Status'],db.inventory.map(i=>[...i.slice(0,6),money(i[6]),pill(i[7])])],procurement:['Supplier Performance',['Supplier','Category','Spend','OTIF','Quality','Risk','Grade'],db.suppliers.map(s=>[s[0],s[1],money(s[2]),s[3]+'%',s[4]+'%',pill(s[5]),pill(s[6])])],sales:['CRM & Sales Pipeline',['Account','Stage','Value','Probability','Weighted','Owner'],db.crm.map(c=>[c[0],c[1],money(c[2]),c[3]+'%',money(c[2]*c[3]/100),c[4]])],hr:['HR & Workforce',['Department','Headcount','Productivity','Overtime','Turnover'],[['Production','186','91%','12%','3.2%'],['Quality','34','88%','8%','2.1%'],['Warehouse','42','84%','14%','4.5%'],['Sales','28','96%','5%','1.8%']]],risk:['Enterprise Risk Register',['Risk','Category','Owner','Score','Mitigation'],db.risks.map(r=>[r[0],r[1],r[2],pill(r[3]*r[4]>=16?'Critical':'Medium'),r[5]])],projects:['Strategic Projects',['Project','Category','Progress','Owner','Status'],db.projects.map(p=>[p[0],p[1],`<div class="min-w-40"><div class="flex justify-between text-xs"><b>${p[2]}</b><span>${p[4]}</span></div><div class="progress"><div class="bar" style="width:${p[2]}"></div></div></div>`,p[3],pill(p[4])])]};
if(tables[state.module]){let t=tables[state.module]; return card(t[0],'Enterprise operational details',table(t[1],t[2].map(r=>`<tr class="border-b">${r.map((c,i)=>`<td class="py-3 pr-4 ${i===0?'font-bold':''}">${c}</td>`).join('')}</tr>`).join('')))}
if(state.module==='workflow')return card('Approval Workflow','Klik approve/reject untuk simulasi dengan audit log',table(['ID','Type','Subject','Amount','Approver','Status','Action'],db.approvals.map((a,i)=>`<tr class="border-b"><td class="py-3 font-bold">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${money(a[3])}</td><td>${a[4]}</td><td>${pill(a[5])}</td><td><button onclick="approve(${i})" class="bg-slate-950 text-white rounded-xl px-3 py-1 text-xs">Approve</button> <button onclick="reject(${i})" class="bg-rose-50 text-rose-700 rounded-xl px-3 py-1 text-xs">Reject</button></td></tr>`).join('')));
if(state.module==='security')return `<div class="grid xl:grid-cols-2 gap-6">${card('RBAC Security','Role access governance',table(['Role','Access','Users','MFA'],[['CEO','All Modules',1,'Enabled'],['CFO','Finance, FP&A',4,'Enabled'],['COO','Production, Inventory, Maintenance',6,'Enabled'],['Auditor','Read Only',2,'Enabled']].map(r=>`<tr class="border-b"><td class="py-3 font-bold">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${pill(r[3])}</td></tr>`).join('')))}${card('Audit Trail','System events',table(['Time','User','Action','Module','Severity'],db.audit.map(a=>`<tr class="border-b"><td class="py-3 font-bold">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td>${pill(a[4])}</td></tr>`).join('')))}</div>`;
if(state.module==='architecture')return card('Enterprise Architecture Blueprint','Layer maturity untuk portfolio',`<div class="grid md:grid-cols-2 gap-4">${['Experience Layer','Application Layer','Integration/API Layer','Data Warehouse Layer','AI Intelligence Layer','Security/Governance Layer','Mobile Layer','Reporting Layer'].map((x,i)=>`<div class="soft p-5 rounded-2xl"><h3 class="font-black">${x}</h3><p class="muted text-sm mt-2">Component maturity and roadmap readiness.</p><div class="progress mt-4"><div class="bar" style="width:${98-i*3}%"></div></div></div>`).join('')}</div>`);
if(state.module==='report')return card('Executive Board Report','Siap diprint / save PDF',`<div class="grid md:grid-cols-4 gap-4 mb-6">${metric('Enterprise Health',el('healthScore')?.textContent||'98','Overall score','📊')}${metric('Projected Revenue',money(101460),'Based on FP&A','📈')}${metric('Critical Risks',crit,'Board attention','⚠️')}${metric('Open Approval',db.approvals.filter(a=>a[5]!=='Approved').length,'Management action','🔀')}</div><h2 class="text-2xl font-black">Executive Summary</h2><p class="muted mt-2">Perusahaan tumbuh positif dengan revenue, EBITDA, pipeline, dan operating control yang kuat. Fokus eksekutif: resin stock, bottleneck Line B, compressor maintenance, working capital, supplier risk, quality hold, dan approval CAPEX.</p><ol class="list-decimal pl-6 mt-4 space-y-2"><li>Approve urgent resin purchase request.</li><li>Resolve Line B bottleneck with kaizen and maintenance.</li><li>Improve DSO through credit control.</li><li>Qualify backup supplier for chemical category.</li><li>Scale strategic OEM pipeline.</li></ol>`);
return ''}
function calcModel(){let g=+el('growth').value,gm=+el('gm').value,opex=+el('opex').value,capex=+el('capex').value; ['gval','gmval','opexval','capexval'].forEach((id,i)=>{let vals=[g+'%',gm+'%',opex,capex]; if(el(id))el(id).textContent=vals[i]}); let rev=89000*(1+g/100), gp=rev*gm/100, ebitda=gp-opex, np=(ebitda-2100-900)*.78, roi=(np/capex*100)||0; el('modelResult').innerHTML=metric('Revenue',money(rev),'Projected','💰')+metric('Gross Profit',money(gp),'Based on margin','📊')+metric('EBITDA',money(ebitda),'Operating profit','📈')+metric('Net Profit',money(np),'After tax','📄')+metric('CAPEX ROI',roi.toFixed(1)+'%','Return estimate','🚀')}
function chartOpts(){let c=state.dark?'#e5e7eb':'#334155',g=state.dark?'rgba(148,163,184,.18)':'rgba(148,163,184,.25)';return {responsive:true,plugins:{legend:{position:'bottom',labels:{color:c}}},scales:{x:{ticks:{color:c},grid:{color:g}},y:{ticks:{color:c},grid:{color:g},beginAtZero:true}}}}
function drawCharts(){if(el('modelResult'))calcModel(); charts.forEach(c=>c.destroy());charts=[];let labels=db.monthly.map(m=>m[0]), ctx=el('chartMain'); if(ctx)charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Actual Revenue',data:db.monthly.map(m=>m[1]),tension:.35,borderWidth:3},{label:'AI Forecast',data:db.monthly.map(m=>m[5]),tension:.35,borderWidth:3},{label:'Net Profit',data:db.monthly.map(m=>m[3]),tension:.35,borderWidth:3}]},options:chartOpts()})); ctx=el('chartFinance'); if(ctx)charts.push(new Chart(ctx,{type:'bar',data:{labels:labels.slice(0,8),datasets:[{label:'Revenue',data:db.monthly.map(m=>m[1]).slice(0,8)},{label:'Gross Profit',data:db.monthly.map(m=>m[2]).slice(0,8)},{label:'EBITDA',data:db.monthly.map(m=>m[4]).slice(0,8)},{label:'Net Profit',data:db.monthly.map(m=>m[3]).slice(0,8)}]},options:chartOpts()}))}
function approve(i){db.approvals[i][5]='Approved';db.audit.unshift([new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),state.role,'Approved '+db.approvals[i][0],'Workflow','Success']);save();render();toast('Approval berhasil')} function reject(i){db.approvals[i][5]='Rejected';db.audit.unshift([new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),state.role,'Rejected '+db.approvals[i][0],'Workflow','Warning']);save();render();toast('Approval ditolak')}
function openMetric(t,v,d){el('modalTitle').textContent=t;el('modalDesc').textContent=d;el('modalBody').innerHTML=`<div class="text-4xl font-black">${v}</div><p class="muted mt-3">Drilldown executive: indikator ini terhubung ke finance, operation, quality, risk, dan board report. Pada versi backend, data dapat ditarik dari PostgreSQL/Firebase/API real-time.</p><div class="grid md:grid-cols-3 gap-3 mt-5">${['Trend','Risk','Action'].map((x,i)=>`<div class="soft rounded-2xl p-4"><b>${x}</b><p class="muted text-sm mt-1">${['Stable positive','Needs monitoring','Assigned to owner'][i]}</p></div>`).join('')}</div>`;el('modal').classList.add('show')} function closeModal(){el('modal').classList.remove('show')}
function globalSearch(){let q=el('search').value.toLowerCase(),box=el('searchResult'); if(!q){box.classList.add('hidden');return} let all=[...db.inventory.flat(),...db.suppliers.flat(),...db.crm.flat(),...db.risks.flat(),...db.approvals.flat(),...db.quality.flat(),...db.maintenance.flat(),...db.projects.flat()].map(String);let res=all.filter(x=>x.toLowerCase().includes(q)).slice(0,18);box.classList.remove('hidden');box.innerHTML=`<b>Search result untuk: ${q}</b><div class="mt-3 flex flex-wrap gap-2">${res.length?res.map(x=>`<span class="soft rounded-full px-3 py-1 text-sm">${x}</span>`).join(''):'<span class="muted">Tidak ada hasil</span>'}</div>`}
function exportCSV(){let rows=[['Module','Metric','Value'],['Finance','Revenue YTD',db.monthly.filter(m=>m[1]).reduce((s,m)=>s+m[1],0).toFixed(1)+' M'],['Inventory','Items',db.inventory.length],['CRM','Weighted Pipeline',db.crm.reduce((s,c)=>s+c[2]*c[3]/100,0).toFixed(0)],['Risk','Critical',db.risks.filter(r=>r[3]*r[4]>=16).length],['Approval','Open',db.approvals.filter(a=>a[5]!=='Approved').length]];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='aldora_enterprise_ultra_max_export.csv';a.click();toast('CSV berhasil diexport')} function snapshot(){let summary={version:VERSION,health:el('healthScore')?.textContent||'98',module:state.module,openApprovals:db.approvals.filter(a=>a[5]!=='Approved').length,criticalRisks:db.risks.filter(r=>r[3]*r[4]>=16).length,created:new Date().toLocaleString('id-ID')};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(summary,null,2)],{type:'application/json'}));a.download='aldora_executive_snapshot.json';a.click();toast('Executive snapshot berhasil dibuat')} function resetData(){if(confirm('Reset data demo ke kondisi awal?')){db=structuredClone(seed);state.module='dashboard';save();render();toast('Data demo berhasil direset')}} function toast(msg){let t=document.createElement('div');t.className='toast card p-4 font-bold';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();el('search')?.focus()}}); render();
</script>
